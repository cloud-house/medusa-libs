packages:
  - "apps/*"
  - "packages/*"

engineStrict: true

# Packages allowed to run install scripts.
allowBuilds:
  "@medusajs/telemetry": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Medusa (docs.medusajs.com/learn/configurations/pnpm): the admin and modules resolve these from root.
publicHoistPattern:
  - "*@medusajs/*"
  - "@tanstack/react-query"
  - "react-i18next"
  - "react-router-dom"

packageExtensions:
  # @medusajs/core-flows@2.21.2 imports uuid without declaring it; a hoisted uuid@13 (ESM only)
  # breaks Jest.
  "@medusajs/core-flows":
    dependencies:
      uuid: "^11.1.1"

# Medusa version lives only here. `medusa` is for devDependencies, `medusa-peer` for peerDependencies.
catalogs:
  medusa:
    "@medusajs/admin-sdk": 2.21.2
    "@medusajs/cli": 2.21.2
    "@medusajs/framework": 2.21.2
    "@medusajs/icons": 2.21.2
    "@medusajs/js-sdk": 2.21.2
    "@medusajs/medusa": 2.21.2
    "@medusajs/test-utils": 2.21.2
    "@medusajs/ui": 4.2.6
    # Admin extensions: the versions the Medusa dashboard ships with.
    "@tanstack/react-query": 5.64.2
    react: 18.3.1
    react-dom: 18.3.1
  medusa-peer:
    "@medusajs/admin-sdk": ~2.21.2
    "@medusajs/framework": ~2.21.2
    "@medusajs/icons": ~2.21.2
    "@medusajs/js-sdk": ~2.21.2
    "@medusajs/medusa": ~2.21.2
    "@medusajs/ui": ~4.2.6
    "@tanstack/react-query": ^5.64.2
    react: ^18.3.1
